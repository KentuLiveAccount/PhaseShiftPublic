<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="{{ .MediaType.Type }}" href="{{ .RelPermalink }}" title="{{ site.Title }}">
  {{ end }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav aria-label="Main navigation">
      <a href="{{ "posts/" | relURL }}">Posts</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>Built with <a href="https://gohugo.io/">Hugo</a>.</footer>
</body>
</html>
