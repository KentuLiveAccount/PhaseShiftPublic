<ul class="post-list">
  {{ range .ByDate.Reverse }}
  <li>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{ if .Draft }}<span class="draft">Draft</span>{{ end }}
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ else }}
  <li>No posts yet.</li>
  {{ end }}
</ul>
